version: 1
defaults:
  ecosystems:
  - package-ecosystem: maven
    ignore:
    - dependency-name: io.modelcontextprotocol.sdk:mcp-bom
      versions:
      - 2.1.0
      - 2.2.0
  - package-ecosystem: maven
    directories:
    - /src/test/resources/e2e-fixtures/plain-app
    - /src/test/resources/e2e-fixtures/test-events
    ignore:
    - dependency-name: io.fluxzero:*
  - package-ecosystem: gradle
    directory: /src/test/resources/e2e-fixtures/test-events
  - github-actions
  - package-ecosystem: npm
    directories:
    - /frontend
    - /src/test/resources/frontend-fixtures/angular
    - /src/test/resources/frontend-fixtures/vite
    ignore:
    - dependency-name: typescript
      update-types:
      - version-update:semver-major
