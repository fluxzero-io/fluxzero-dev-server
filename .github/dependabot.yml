version: 2
registries:
  fluxzero-public-maven:
    type: maven-repository
    url: https://packages.fluxzero.io/maven

updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries: [fluxzero-public-maven]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: maven
    directories:
      - /src/test/resources/e2e-fixtures/plain-app
      - /src/test/resources/e2e-fixtures/test-events
    registries: [fluxzero-public-maven]
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      # The plain-app SDK version is substituted by the owning E2E test.
      - dependency-name: "io.fluxzero:*"
    groups:
      fixture-maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /src/test/resources/frontend-fixtures/angular
      - /src/test/resources/frontend-fixtures/vite
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      # Angular's compiler/build packages require TypeScript >=6.0 <6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
