<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17453b">
  <title>Repair Café · Work Queue</title>
  <style>
    :root{--forest:#17453b;--forest-2:#216052;--mint:#dcece5;--cream:#f4f0e6;--paper:#fffdf8;--ink:#202821;--muted:#667069;--line:#d9ddd5;--orange:#e86f3d;--gold:#d89a22;--red:#b4463f;--shadow:0 18px 44px rgba(34,48,39,.12)}
    *{box-sizing:border-box}html{background:var(--cream)}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto}
    header{background:var(--forest);color:white;padding:20px 0 92px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:44px;height:44px;border:2px solid rgba(255,255,255,.7);border-radius:50%;display:grid;place-items:center;font-size:22px}.brand-name{font-family:Georgia,serif;font-size:22px;font-weight:700}.brand-sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#bcd1ca}
    .primary,.secondary,.danger,.ghost{border:0;border-radius:10px;padding:11px 16px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.primary{background:var(--orange);color:white;box-shadow:0 5px 0 #a84725}.primary:hover{transform:translateY(-1px);background:#f07945}.secondary{background:var(--forest);color:white}.secondary:hover{background:var(--forest-2)}.danger{background:#f8e3df;color:#8d302b}.ghost{background:transparent;color:var(--forest);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
    main{margin-top:-66px;padding-bottom:64px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:stretch}.intro,.summary,.panel{background:var(--paper);border:1px solid rgba(23,69,59,.12);border-radius:18px;box-shadow:var(--shadow)}.intro{padding:28px}.eyebrow{color:var(--orange);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:850}.intro h1{font-family:Georgia,serif;font-size:clamp(30px,4vw,47px);line-height:1.02;margin:7px 0 10px;color:var(--forest)}.intro p{margin:0;color:var(--muted);max-width:620px}.summary{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px 14px;border-radius:12px;background:#f2f4ee}.stat strong{display:block;font-size:24px;color:var(--forest)}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
    .panel{margin-top:22px;overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.panel-head h2{font-family:Georgia,serif;font-size:25px;margin:0;color:var(--forest)}.count{color:var(--muted);font-size:14px}.filters{display:flex;gap:7px;overflow-x:auto;padding:14px 22px;border-bottom:1px solid var(--line);background:#faf8f1}.filter{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--muted);padding:8px 13px;border-radius:999px;font-weight:700}.filter.active{background:var(--forest);border-color:var(--forest);color:white}
    .queue{padding:8px 22px 22px}.ticket{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:18px;align-items:center;padding:17px 4px;border-bottom:1px solid var(--line);cursor:pointer}.ticket:last-child{border:0}.ticket:hover .ticket-name{color:var(--orange)}.ticket-id{font-weight:850;color:var(--forest);font-size:13px}.ticket-name{font-weight:800;font-size:17px;transition:.15s}.ticket-problem{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.badges{display:flex;align-items:center;gap:8px;justify-content:flex-end}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850;letter-spacing:.05em;text-transform:uppercase}.priority-HIGH{background:#f9ded7;color:#963a28}.priority-NORMAL{background:#f6e9c7;color:#805b0e}.priority-LOW{background:#e7ebe7;color:#526057}.status-OPEN{background:#e3eee8;color:#285d4e}.status-IN_PROGRESS{background:#dfeaf6;color:#315d86}.status-COMPLETED{background:#dcebdc;color:#2d6634}.status-CANCELLED{background:#eee4e2;color:#7b4843}
    .state{padding:46px 20px;text-align:center;color:var(--muted)}.state-icon{font-size:34px;margin-bottom:8px}.state h3{margin:0 0 5px;color:var(--forest)}.skeleton{height:72px;margin:14px 0;border-radius:12px;background:linear-gradient(90deg,#ecece5 25%,#f8f7f2 50%,#ecece5 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}
    .detail{padding:24px}.back{border:0;background:transparent;color:var(--forest);font-weight:800;padding:0;margin-bottom:18px}.detail-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.detail h2{font-family:Georgia,serif;color:var(--forest);font-size:34px;margin:4px 0}.detail-id{color:var(--muted);font-weight:750}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.detail-card{background:#f5f4ed;border-radius:12px;padding:15px}.detail-card label{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.detail-card div{font-weight:650;overflow-wrap:anywhere}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 26px}.timeline{border-top:1px solid var(--line);padding-top:22px}.timeline h3{font-family:Georgia,serif;color:var(--forest);font-size:22px}.history-item{display:grid;grid-template-columns:18px 1fr;gap:12px;position:relative;padding-bottom:20px}.history-item:not(:last-child):before{content:"";position:absolute;left:7px;top:17px;bottom:0;width:2px;background:var(--mint)}.dot{width:16px;height:16px;border-radius:50%;background:var(--orange);border:4px solid #f9dcd0}.history-main strong{display:block}.history-main span{font-size:13px;color:var(--muted)}
    dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 28px));box-shadow:0 30px 90px rgba(20,36,29,.35);background:var(--paper)}dialog::backdrop{background:rgba(15,35,29,.58);backdrop-filter:blur(2px)}.modal-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-family:Georgia,serif;color:var(--forest);margin:0}.close{border:0;background:#eeeee8;width:34px;height:34px;border-radius:50%;font-size:20px}.modal-body{padding:22px 24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:750;font-size:13px}.field input,.field select,.field textarea{border:1px solid #bfc6be;border-radius:9px;padding:11px 12px;background:white;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid rgba(232,111,61,.18);border-color:var(--orange)}.field textarea{min-height:104px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.form-error{margin-top:13px;color:var(--red);background:#fae9e6;padding:10px 12px;border-radius:9px;font-size:14px}.hidden{display:none!important}
    .toast{position:fixed;right:22px;bottom:22px;background:var(--forest);color:white;border-radius:12px;padding:13px 17px;box-shadow:var(--shadow);z-index:10;max-width:360px}.toast.error{background:#8c3832}
    @media(max-width:760px){header{padding-bottom:80px}.hero{grid-template-columns:1fr}.summary{grid-template-columns:repeat(4,1fr)}.stat{padding:10px;text-align:center}.stat strong{font-size:20px}.stat span{font-size:9px}.ticket{grid-template-columns:72px 1fr}.badges{grid-column:2;justify-content:flex-start}.detail-grid{grid-template-columns:1fr}.topbar .primary span{display:none}}
    @media(max-width:480px){.shell{width:min(100% - 20px,1120px)}.intro{padding:22px}.summary{grid-template-columns:1fr 1fr}.panel-head{align-items:flex-start;flex-direction:column}.queue{padding-inline:15px}.ticket{gap:10px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.detail{padding:18px}.detail-top{flex-direction:column}.modal-body,.modal-head{padding-inline:18px}}
  </style>
</head>
<body>
<header><div class="shell topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">⌁</div><div><div class="brand-name">Repair Café</div><div class="brand-sub">Volunteer workbench</div></div></div><button class="primary" id="newTicket"><span>＋</span> Register item</button></div></header>
<main class="shell">
  <section class="hero">
    <div class="intro"><div class="eyebrow">Today’s workshop</div><h1>Give broken things<br>a second life.</h1><p>Register visitor items, keep repairs moving, and preserve every decision from drop-off to hand-back.</p></div>
    <div class="summary" aria-label="Ticket totals"><div class="stat"><strong id="statOpen">—</strong><span>Open</span></div><div class="stat"><strong id="statProgress">—</strong><span>In progress</span></div><div class="stat"><strong id="statCompleted">—</strong><span>Completed</span></div><div class="stat"><strong id="statCancelled">—</strong><span>Cancelled</span></div></div>
  </section>
  <section class="panel" id="queuePanel">
    <div class="panel-head"><div><h2>Work queue</h2><div class="count" id="queueCount">Loading tickets…</div></div><button class="ghost" id="refreshQueue">↻ Refresh</button></div>
    <div class="filters" role="group" aria-label="Filter queue by status"><button class="filter active" data-status="">All</button><button class="filter" data-status="OPEN">Open</button><button class="filter" data-status="IN_PROGRESS">In progress</button><button class="filter" data-status="COMPLETED">Completed</button><button class="filter" data-status="CANCELLED">Cancelled</button></div>
    <div class="queue" id="queue"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>
  <section class="panel hidden" id="detailPanel"><div class="detail" id="detail"></div></section>
</main>

<dialog id="registerDialog"><form id="registerForm"><div class="modal-head"><h2>Register an item</h2><button type="button" class="close" data-close aria-label="Close">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="ticketId">Ticket identifier</label><input id="ticketId" name="ticketId" required maxlength="40" placeholder="RC-204"></div><div class="field"><label for="priority">Priority</label><select id="priority" name="priority"><option value="NORMAL">Normal</option><option value="HIGH">High</option><option value="LOW">Low</option></select></div><div class="field full"><label for="itemName">Item name</label><input id="itemName" name="itemName" required maxlength="100" placeholder="Table lamp"></div><div class="field full"><label for="problemDescription">Problem description</label><textarea id="problemDescription" name="problemDescription" required maxlength="1000" placeholder="What is wrong, and what has already been tried?"></textarea></div></div><div class="form-error hidden" id="registerError"></div><div class="form-actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary" type="submit">Register ticket</button></div></div></form></dialog>
<dialog id="actionDialog"><form id="actionForm"><div class="modal-head"><h2 id="actionTitle">Update ticket</h2><button type="button" class="close" data-close aria-label="Close">×</button></div><div class="modal-body"><div class="field"><label id="actionLabel" for="actionText">Details</label><textarea id="actionText" required maxlength="1000"></textarea></div><div class="form-error hidden" id="actionError"></div><div class="form-actions"><button type="button" class="ghost" data-close>Back</button><button class="secondary" type="submit" id="actionSubmit">Save</button></div></div></form></dialog>
<div class="toast hidden" id="toast" role="status"></div>
<script>
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  let activeStatus='', activeTicket=null, actionKind='';
  const labels={OPEN:'Open',IN_PROGRESS:'In progress',COMPLETED:'Completed',CANCELLED:'Cancelled'};
  const actions={REGISTERED:'Ticket registered',STARTED:'Repair started',COMPLETED:'Repair completed',CANCELLED:'Repair cancelled'};
  const clean=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  async function api(path,options={}){const response=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const text=await response.text();let body=null;try{body=text?JSON.parse(text):null}catch{body=text}if(!response.ok){let message=body?.message||body?.error||body?.details||body||`Request failed (${response.status})`;if(typeof message!=='string')message=JSON.stringify(message);if(/already exists/i.test(message))message='A ticket with this identifier already exists.';throw new Error(message)}return body}
  function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className=`toast${error?' error':''}`;setTimeout(()=>el.classList.add('hidden'),3500)}
  function loading(){ $('#queue').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'; $('#queueCount').textContent='Loading tickets…' }
  function ticketRow(t){return `<article class="ticket" tabindex="0" data-id="${clean(t.ticketId)}"><div class="ticket-id">${clean(t.ticketId)}</div><div><div class="ticket-name">${clean(t.itemName)}</div><div class="ticket-problem">${clean(t.problemDescription)}</div></div><div class="badges"><span class="badge priority-${t.priority}">${clean(t.priority)}</span><span class="badge status-${t.status}">${labels[t.status]}</span></div></article>`}
  async function loadQueue(){loading();try{const suffix=activeStatus?`?status=${activeStatus}`:'';const [queue,all]=await Promise.all([api('/api/tickets'+suffix),activeStatus?api('/api/tickets'):Promise.resolve(null)]);const complete=all||queue;for(const status of Object.keys(labels))$(`#stat${status==='IN_PROGRESS'?'Progress':status[0]+status.slice(1).toLowerCase()}`).textContent=complete.items.filter(t=>t.status===status).length;$('#queueCount').textContent=`${queue.total} ${queue.total===1?'ticket':'tickets'}${activeStatus?' · '+labels[activeStatus]:''}`;$('#queue').innerHTML=queue.items.length?queue.items.map(ticketRow).join(''):`<div class="state"><div class="state-icon">🧰</div><h3>No ${activeStatus?labels[activeStatus].toLowerCase()+' ':''}tickets</h3><p>${activeStatus?'Choose another filter or register a new item.':'The workbench is clear. Register the first visitor item.'}</p></div>`;bindRows()}catch(e){$('#queueCount').textContent='Could not load queue';$('#queue').innerHTML=`<div class="state"><div class="state-icon">⚠</div><h3>Queue unavailable</h3><p>${clean(e.message)}</p><button class="secondary" onclick="loadQueue()">Try again</button></div>`}}
  function bindRows(){$$('.ticket').forEach(el=>{const open=()=>showTicket(el.dataset.id);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
  async function showTicket(id){$('#queuePanel').classList.add('hidden');$('#detailPanel').classList.remove('hidden');$('#detail').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';try{activeTicket=await api('/api/tickets/'+encodeURIComponent(id));history.replaceState(null,'','#ticket/'+encodeURIComponent(id));renderDetail()}catch(e){$('#detail').innerHTML=`<button class="back" onclick="showQueue()">← Back to queue</button><div class="state"><h3>Ticket unavailable</h3><p>${clean(e.message)}</p></div>`}}
  function renderDetail(){const t=activeTicket;const terminal=t.status==='COMPLETED'||t.status==='CANCELLED';const info=t.status==='COMPLETED'?`<div class="detail-card"><label>Resolution</label><div>${clean(t.resolutionSummary)}</div></div>`:t.status==='CANCELLED'?`<div class="detail-card"><label>Cancellation reason</label><div>${clean(t.cancellationReason)}</div></div>`:'';const history=t.history.map(h=>`<div class="history-item"><div class="dot"></div><div class="history-main"><strong>${actions[h.action]}</strong><div>${clean(h.detail)}</div><span>${new Date(h.occurredAt).toLocaleString()}</span></div></div>`).join('');$('#detail').innerHTML=`<button class="back" onclick="showQueue()">← Back to queue</button><div class="detail-top"><div><div class="detail-id">${clean(t.ticketId)}</div><h2>${clean(t.itemName)}</h2></div><div class="badges"><span class="badge priority-${t.priority}">${t.priority}</span><span class="badge status-${t.status}">${labels[t.status]}</span></div></div><div class="detail-grid"><div class="detail-card"><label>Problem</label><div>${clean(t.problemDescription)}</div></div><div class="detail-card"><label>Current state</label><div>${labels[t.status]}</div></div>${info}</div><div class="actions">${t.status==='OPEN'?'<button class="secondary" onclick="startRepair()">Start repair</button>':''}${t.status==='IN_PROGRESS'?'<button class="primary" onclick="openAction(\'complete\')">Complete repair</button>':''}${!terminal?'<button class="danger" onclick="openAction(\'cancel\')">Cancel ticket</button>':''}</div><div class="timeline"><h3>Ticket history</h3>${history}</div>`}
  function showQueue(){history.replaceState(null,'',location.pathname);$('#detailPanel').classList.add('hidden');$('#queuePanel').classList.remove('hidden');activeTicket=null;loadQueue()}
  async function startRepair(){try{activeTicket=await api(`/api/tickets/${encodeURIComponent(activeTicket.ticketId)}/start`,{method:'POST'});toast('Repair started');renderDetail()}catch(e){toast(e.message,true);await showTicket(activeTicket.ticketId)}}
  function openAction(kind){actionKind=kind;$('#actionTitle').textContent=kind==='complete'?'Complete repair':'Cancel ticket';$('#actionLabel').textContent=kind==='complete'?'Resolution summary':'Cancellation reason';$('#actionText').placeholder=kind==='complete'?'What was repaired or replaced?':'Why is this ticket being cancelled?';$('#actionText').value='';$('#actionError').classList.add('hidden');$('#actionDialog').showModal();$('#actionText').focus()}
  $('#actionForm').onsubmit=async e=>{e.preventDefault();const text=$('#actionText').value.trim(), error=$('#actionError');if(!text){error.textContent='Please enter a clear summary.';error.classList.remove('hidden');return}const path=`/api/tickets/${encodeURIComponent(activeTicket.ticketId)}/${actionKind}`;const body=actionKind==='complete'?{resolutionSummary:text}:{reason:text};const submit=$('#actionSubmit');submit.disabled=true;try{activeTicket=await api(path,{method:'POST',body:JSON.stringify(body)});$('#actionDialog').close();toast(actionKind==='complete'?'Repair completed':'Ticket cancelled');renderDetail()}catch(ex){error.textContent=ex.message;error.classList.remove('hidden')}finally{submit.disabled=false}};
  $('#newTicket').onclick=()=>{$('#registerForm').reset();$('#registerError').classList.add('hidden');$('#registerDialog').showModal();$('#ticketId').focus()};
  $('#registerForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget)),error=$('#registerError');for(const key of ['ticketId','itemName','problemDescription'])data[key]=data[key].trim();if(!data.ticketId||!data.itemName||!data.problemDescription){error.textContent='Ticket identifier, item name, and problem description are required.';error.classList.remove('hidden');return}const submit=e.currentTarget.querySelector('[type=submit]');submit.disabled=true;try{const ticket=await api('/api/tickets',{method:'POST',body:JSON.stringify(data)});$('#registerDialog').close();toast(`Ticket ${ticket.ticketId} registered`);activeStatus='';$$('.filter').forEach(b=>b.classList.toggle('active',!b.dataset.status));await loadQueue();showTicket(ticket.ticketId)}catch(ex){error.textContent=ex.message;error.classList.remove('hidden')}finally{submit.disabled=false}};
  $$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$$('.filter').forEach(b=>b.onclick=()=>{activeStatus=b.dataset.status;$$('.filter').forEach(x=>x.classList.toggle('active',x===b));loadQueue()});$('#refreshQueue').onclick=loadQueue;
  const hash=decodeURIComponent(location.hash);if(hash.startsWith('#ticket/'))showTicket(hash.slice(8));else loadQueue();
</script>
</body>
</html>
