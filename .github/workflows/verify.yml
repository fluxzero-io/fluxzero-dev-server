name: Verify

on:
  workflow_call:
    secrets:
      AUDITLOG_APP_CLIENT_ID:
        description: Organization-owned Auditlog build app client ID
        required: true
      AUDITLOG_APP_PRIVATE_KEY:
        description: Auditlog build app private key
        required: true

env:
  BUILD_ENVIRONMENT: github

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            maven: ./mvnw
          - name: macOS
            os: macos-latest
            maven: ./mvnw
          - name: Windows
            os: windows-latest
            maven: .\mvnw.cmd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitoring-source
        with:
          client-id: ${{ secrets.AUDITLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDITLOG_APP_PRIVATE_KEY }}
      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        timeout-minutes: 20
        run: ${{ matrix.maven }} -B clean install
      - name: Test Devboard frontend
        # Maven's pinned Node is also used for tests, independent of the runner default.
        run: ./target/frontend-tools/node/node target/frontend-tools/node/node_modules/npm/bin/npm-cli.js test --prefix frontend
        if: runner.os != 'Windows'
      - name: Test Devboard frontend on Windows
        if: runner.os == 'Windows'
        run: ./target/frontend-tools/node/node.exe target/frontend-tools/node/node_modules/npm/bin/npm-cli.js test --prefix frontend
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.name }}
          path: target/surefire-reports/

  application-e2e:
    name: Application E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitoring-source
        with:
          client-id: ${{ secrets.AUDITLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDITLOG_APP_PRIVATE_KEY }}
      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Disable compiler annotations for negative tests
        run: echo "::remove-matcher owner=maven-javac::"
      - name: Test complete application workflows
        run: ./mvnw -B verify -Pdev-server-e2e

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitoring-source
        with:
          client-id: ${{ secrets.AUDITLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDITLOG_APP_PRIVATE_KEY }}
      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/test/resources/frontend-fixtures/**/package-lock.json
      - name: Test Vite and Angular workflows
        run: ./mvnw -B verify -Pdev-server-frontend-e2e

  publication:
    name: Maven publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitoring-source
        with:
          client-id: ${{ secrets.AUDITLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDITLOG_APP_PRIVATE_KEY }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set local qualification version
        run: ./mvnw -B versions:set -DnewVersion=0.0.0
      - name: Deploy release attachments to a temporary Maven repository
        run: >-
          ./mvnw -B -Psign deploy -DskipTests -Dgpg.skip
          "-DaltDeploymentRepository=fluxzero::file://${{ runner.temp }}/publication"
      - name: Resolve and run an independent consumer
        run: bash .github/scripts/verify-packages-consumer.sh 0.0.0 'file://${{ runner.temp }}/publication'
