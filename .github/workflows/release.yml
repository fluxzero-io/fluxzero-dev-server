name: Release

on:
  push:
    branches: [ main ]
    tags-ignore:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  BUILD_ENVIRONMENT: github

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  version:
    name: Determine version
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select explicit or initial release version
        id: existing
        shell: bash
        run: |
          git fetch --tags --force
          current=$(git tag --points-at "$GITHUB_SHA" --sort=-version:refname \
            | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          if [ -n "$current" ]; then
            echo "selected=$current" >> "$GITHUB_OUTPUT"
          elif git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            echo "selected=" >> "$GITHUB_OUTPUT"
          else
            echo "selected=1.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate semantic version
        id: version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ github.token }}
          tag_prefix: ""
          default_bump: patch
          commit_analyzer_preset: angular
          ignore_keywords: ""
          custom_tag: ${{ steps.existing.outputs.selected }}
          custom_release_rules: "deps:patch:Dependency updates"
          dry_run: true

  package:
    name: Package release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitoring-source
        with:
          client-id: ${{ secrets.AUDITLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDITLOG_APP_PRIVATE_KEY }}
      - name: Set release timestamp
        run: echo "RELEASE_TIMESTAMP=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set release version
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.version.outputs.version }}
      - name: Build release artifacts
        run: ./mvnw -B clean install -Psign -DskipTests -Dgpg.skip
      - name: Verify standalone manifest
        shell: bash
        run: |
          SDK_VERSION=$(./mvnw -q help:evaluate -Dexpression=fluxzero.version -DforceStdout)
          unzip -p target/fluxzero-dev-server-${{ needs.version.outputs.version }}-standalone.jar META-INF/MANIFEST.MF > target/standalone-manifest.txt
          grep -F "Implementation-Version: ${{ needs.version.outputs.version }}" target/standalone-manifest.txt
          grep -F "Fluxzero-SDK-Version: $SDK_VERSION" target/standalone-manifest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            target/fluxzero-dev-server-${{ needs.version.outputs.version }}.jar
            target/fluxzero-dev-server-${{ needs.version.outputs.version }}-standalone.jar
            target/fluxzero-dev-server-${{ needs.version.outputs.version }}-sources.jar
            target/fluxzero-dev-server-${{ needs.version.outputs.version }}-javadoc.jar

  tag:
    name: Tag release
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release tag
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch origin --force --tags
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi

  packages:
    name: Publish to Fluxzero Packages
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitoring-source
        with:
          client-id: ${{ secrets.AUDITLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDITLOG_APP_PRIVATE_KEY }}
      - name: Set release timestamp
        run: echo "RELEASE_TIMESTAMP=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install Java and Maven credentials
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: fluxzero
          server-username: MAVEN_USERNAME
          server-password: MAVEN_DEPLOY_TOKEN
      - name: Set release version
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.version.outputs.version }}
      - name: Prepare release before requesting the short-lived token
        run: ./mvnw -B -Psign install -DskipTests -Dgpg.skip
      - name: Publish with GitHub OIDC
        env:
          MAVEN_USERNAME: github-actions
          MAVEN_GPG_KEY: ${{ secrets.OSSRH_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_SIGNING_PASSPHRASE }}
        run: |
          set +x
          token=$(curl --fail --silent --show-error --get \
            --data-urlencode 'audience=https://packages.fluxzero.io/publish/maven' \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$token"
          export MAVEN_DEPLOY_TOKEN="$token"
          ./mvnw -B -Psign deploy -DskipTests

  packages-smoke:
    name: Verify Fluxzero Packages consumer
    needs: [version, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Download and run standalone release with an empty cache
        run: bash .github/scripts/verify-packages-consumer.sh '${{ needs.version.outputs.version }}'

  github-release:
    name: Publish GitHub release
    needs: [version, packages-smoke, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: >-
          gh release create "$RELEASE_VERSION"
          release-artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "Fluxzero Dev Server $RELEASE_VERSION"
          --generate-notes
